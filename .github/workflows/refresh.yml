name: refresh

on:
  schedule:
    - cron: "0 13 * * *" # 6am PT
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python pipeline/ingest.py && python pipeline/estimate.py && python pipeline/brief.py && python pipeline/summary.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/METHOD.md data/appintel.db data/brief.json brief.html ops/summary.json
          git diff --cached --quiet || git commit -m "chore: refresh Apple chart estimates and genre brief"
          git push
      - name: Publish the refreshed site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
